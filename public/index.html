<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mock Test - Giao diện làm bài</title>

    <style>
      /* Reset / base */
      * { box-sizing: border-box; }
      html,body { height:100%; margin:0; font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#f3f6f9; color:#0f1720; }
      a { color: #0b60d6; text-decoration: none; }
      button { font: inherit; }

      /* Page layout */
      .page {
        max-width:1200px;
        margin:28px auto;
        padding:18px;
      }

      /* The white card that contains the exam area */
      .exam-wrapper {
        background: #fff;
        border-radius: 10px;
        padding: 22px;
        display: grid;
        grid-template-columns: 160px 1fr 260px;
        gap: 20px;
        align-items: start;
        box-shadow: 0 8px 24px rgba(15,23,42,0.06);
        position: relative;
      }
      
      .nav-item.answered {
        background: #cde3ff; /* xanh nhạt */
        border-color: #93c5fd;
      }
      
      .result-summary {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      
      .result-summary th, .result-summary td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid #e1e8ed;
      }
      
      .result-summary th {
        font-weight: 600;
        width: 180px;
        background-color: #f8fafc;
      }
      
      .result-summary tr:last-child th, 
      .result-summary tr:last-child td {
        border-bottom: none;
      }
      
      .question-review {
        margin: 20px 0;
        border: 1px solid #e1e8ed;
        border-radius: 6px;
        background: #f9fcff;
      }
      
      .question-header {
        background: #eef6ff;
        padding: 8px 12px;
        font-weight: bold;
        border-bottom: 1px solid #e1e8ed;
      }
      
      .question-body { 
        padding: 12px; 
      }
      
      .option { 
        padding: 6px 10px; 
        margin: 4px 0; 
        border-radius: 4px; 
      }
      
      .option.correct { 
        background: #d7f5dc; 
        border: 1px solid #9ee5a5; 
      }
      
      .option.incorrect { 
        background: #fbe6e6; 
        border: 1px solid #e8b7b7; 
      }
      
      .note {
        background: #fff9e6;
        padding: 8px 10px;
        border-radius: 4px;
        margin-top: 8px;
      }
      
      .review-nav-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-top: 10px;
      }
      
      .nav-cell {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      
      .nav-cell.correct { background: #36b24a; }
      .nav-cell.incorrect { background: #c72626; }

      /* top centered Back button */
      .back-wrap { 
        position: static; 
        transform: none; 
        top: auto; 
        left: auto; 
        display: none; 
      }
      
      .btn-prev {
        background:#e6eef3;
        color:#0f1720;
        padding:10px 14px;
        border-radius:8px;
        border:1px solid #d1dbe6;
        cursor:pointer;
        box-shadow:none;
      }

      /* Left small question summary panel */
      .question-summary {
        background: transparent;
        border: 1px solid #e6eef3;
        border-radius: 6px;
        padding: 12px;
        font-size: 14px;
        height: fit-content;
      }
      
      .question-summary h4 {
        margin:0 0 8px 0;
        font-size:15px;
      }
      
      .question-summary .meta { 
        font-size:13px; 
        color:#475569; 
        line-height:1.4; 
        margin-bottom:10px; 
      }
      
      .question-summary .flag { 
        display:inline-block; 
        margin-top:8px; 
        color:#0b60d6; 
        cursor:pointer; 
        font-size:13px; 
      }

      /* Center big question card */
      .question-card {
        padding: 22px;
        border-radius: 8px;
        background: #e8f6f7; /* pale blue */
        min-height: 220px;
        display:flex;
        flex-direction: column;
        gap: 12px;
      }
      
      .question-card .question-text {
        font-size:18px;
        margin:0 0 6px 0;
        color:#062a3f;
      }

      .choices {
        margin-top: 8px;
      }
      
      .choice {
        display:flex;
        gap:12px;
        align-items:flex-start;
        padding: 10px 12px;
        border-radius:6px;
        margin-bottom:10px;
        background: transparent;
        cursor:pointer;
        border: 1px solid transparent;
      }
      
      .choice:hover { 
        border-color: rgba(3,102,214,0.08); 
        background: rgba(3,102,214,0.02); 
      }
      
      .choice .radio {
        width:18px;
        height:18px;
        border-radius:50%;
        border:2px solid #a7b3bd;
        display:inline-block;
        flex: 0 0 18px;
        margin-top:4px;
      }
      
      .choice .radio.selected {
        border-color:#0b60d6;
        background: #0b60d6;
      }
      
      .choice .label {
        font-weight:600;
        min-width:18px;
      }
      
      .choice .text {
        color:#0f1720;
      }

      /* Next button bottom right of center column */
      .center-footer {
        display: flex;
        justify-content: space-between; /* left = previous, right = next */
        margin-top: 8px;
        align-items: center;
      }
      
      .btn-next {
        background:#0b60d6;
        color:#fff;
        padding:10px 16px;
        border-radius:8px;
        border:none;
        cursor:pointer;
        box-shadow: 0 6px 14px rgba(11,96,214,0.18);
      }

      /* Right nav panel */
      .nav-panel {
        background: #fff;
        border-radius:8px;
        padding:14px;
        border: 1px solid #f0f4f8;
        box-shadow: 0 4px 10px rgba(15,23,42,0.03);
      }
      
      .nav-panel h3 {
        margin:0 0 12px 0;
        font-size:18px;
      }
      
      .nav-grid {
        display:grid;
        grid-template-columns: repeat(5, 1fr);
        gap:8px;
      }
      
      .nav-item {
        background:#fff;
        border:2px solid #cbd5e1;
        width:40px;
        height:40px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:6px;
        cursor:pointer;
        font-weight:600;
        color:#0f1720;
      }
      
      .nav-item.current {
        border-color:#0b60d6;
        background:#fff;
        box-shadow: inset 0 0 0 3px rgba(11,96,214,0.06);
      }
      
      .nav-actions {
        margin-top:12px;
      }
      
      .finish-link { 
        color:#0b60d6; 
        display:inline-block; 
        margin-top:8px; 
      }

      /* Top-right close button like screenshot */
      .close-btn {
        position:absolute;
        right: -18px;
        top: -18px;
        width:44px;
        height:44px;
        border-radius:10px;
        border:2px solid #2b5fbf;
        background:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#2b5fbf;
        font-weight:700;
        cursor:pointer;
      }

      /* Responsive */
      @media (max-width: 980px) {
        .exam-wrapper { grid-template-columns: 1fr; }
        .nav-panel { order: 3; }
        .question-summary { order: 1; display:flex; justify-content:space-between; align-items:center; }
      }
      
      /* Result screen styles */
      .result-screen {
        padding: 20px;
      }
      
      .result-container {
        display: flex;
        gap: 40px;
        margin-bottom: 30px;
      }
      
      .result-summary-panel {
        min-width: 360px;
      }
      
      .result-details-panel {
        flex: 1;
      }
      
      .result-navigation-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      
      .grade-display {
        margin-top: 15px;
        padding: 10px;
        background-color: #eaf7ea;
        border-radius: 6px;
        text-align: center;
      }
      
      .finish-review-btn {
        margin-top: 10px;
        padding: 8px 16px;
        background: #0b60d6;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- React + Babel (for quick dev with Live Server). Suitable for local/dev only -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="../src/pages/MockTest.js"></script>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      
      // Mock data for questions
    

      function Choice({ idx, text, selected, onSelect }) {
        return (
          <div
            role="radio"
            aria-checked={selected}
            tabIndex={0}
            className="choice"
            onClick={() => onSelect(idx)}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') onSelect(idx); }}
          >
            <span className={'radio ' + (selected ? 'selected' : '')} aria-hidden="true"></span>
            <span className="label">{String.fromCharCode(97 + idx)}.</span>
            <div className="text">{text}</div>
          </div>
        );
      }

      function App() {
        const [questions] = useState(QUESTIONS);
        const [current, setCurrent] = useState(0);
        const [answers, setAnswers] = useState({});
        const [finished, setFinished] = useState(false);
        const [quizMeta, setQuizMeta] = useState({
          startedOn: new Date().toLocaleString(),
          state: "In progress",
          completedOn: "",
          timeTaken: "",
          totalMarks: 10,
        });
        const startTime = useRef(Date.now());

        useEffect(() => {
          document.getElementById('summary-number').textContent = current + 1;
          const status = answers[questions[current].id] === undefined ? 'Not yet answered' : 'Answered';
          document.getElementById('summary-status').textContent = status;

          const prevBtn = document.getElementById('prevBtn');
          if (prevBtn) prevBtn.style.display = current === 0 ? 'none' : 'inline-block';
        });

        const handleSelect = (choiceIdx) => {
          const qid = questions[current].id;
          setAnswers(prev => {
            const currentChoice = prev[qid];
            if (currentChoice === choiceIdx) {
              const newAnswers = { ...prev };
              delete newAnswers[qid];
              return newAnswers;
            }
            return { ...prev, [qid]: choiceIdx };
          });
        };

        const goNext = () => setCurrent(c => Math.min(questions.length - 1, c + 1));
        const goPrev = () => setCurrent(c => Math.max(0, c - 1));
        const goTo = (index) => setCurrent(index);

        useEffect(() => {
          const navGrid = document.getElementById('navGrid');
          if (!navGrid) return;
          
          navGrid.innerHTML = '';
          questions.forEach((q, i) => {
            const div = document.createElement('div');
            const isCurrent = i === current;
            const isAnswered = answers[q.id] !== undefined;
            div.className = 'nav-item';
            if (isCurrent) div.classList.add('current');
            if (isAnswered) div.classList.add('answered');
            div.textContent = i + 1;
            div.onclick = () => goTo(i);
            navGrid.appendChild(div);
          });
        }, [questions, current, answers]);

        useEffect(() => {
          const container = document.getElementById('choicesContainer');
          if (!container) return;
          
          ReactDOM.createRoot(container).render(
            <div>
              {questions[current].choices.map((ch, idx) => (
                <Choice
                  key={idx}
                  idx={idx}
                  text={ch}
                  selected={answers[questions[current].id] === idx}
                  onSelect={handleSelect}
                />
              ))}
            </div>
          );
        }, [questions, current, answers]);

        useEffect(() => {
          const finishLink = document.getElementById('finishLink');
          const nextBtn = document.getElementById('nextBtn');
          const prevBtn = document.getElementById('prevBtn');
          const closeBtn = document.getElementById('closeBtn');

          const nHandler = () => goNext();
          const pHandler = () => goPrev();
          const cHandler = () => alert('Close clicked');

          const fHandler = (e) => {
            e.preventDefault();
            const confirmSubmit = confirm("Are you sure you want to finish and submit your test?");
            if (confirmSubmit) {
              showResult();
            }
          };

          nextBtn?.addEventListener('click', nHandler);
          prevBtn?.addEventListener('click', pHandler);
          closeBtn?.addEventListener('click', cHandler);
          finishLink?.addEventListener('click', fHandler);

          return () => {
            nextBtn?.removeEventListener('click', nHandler);
            prevBtn?.removeEventListener('click', pHandler);
            closeBtn?.removeEventListener('click', cHandler);
            finishLink?.removeEventListener('click', fHandler);
          };
        }, [answers]);

        // Hiển thị kết quả chi tiết (giống Moodle)
        const showResult = () => {
          const endTime = Date.now();
          const durationSec = Math.floor((endTime - startTime.current) / 1000);
          const mins = Math.floor(durationSec / 60);
          const secs = durationSec % 60;

          const updatedQuizMeta = {
            ...quizMeta,
            state: "Finished",
            completedOn: new Date().toLocaleString(),
            timeTaken: `${mins} mins ${secs} secs`
          };
          
          setQuizMeta(updatedQuizMeta);

          let score = 0;
          questions.forEach(q => {
            if (answers[q.id] === q.correctIndex) score++;
          });
          
          const total = questions.length;
          const grade = ((score / total) * 10).toFixed(2);
          const percent = ((score / total) * 100).toFixed(0);

          // Tạo nội dung kết quả
          const resultHTML = `
            <div class="result-screen">
              <div class="result-container">
                <!-- BẢNG THÔNG TIN -->
                <div class="result-summary-panel">
                  <table class="result-summary">
                    <tr><th>Started on</th><td>${updatedQuizMeta.startedOn}</td></tr>
                    <tr><th>State</th><td>${updatedQuizMeta.state}</td></tr>
                    <tr><th>Completed on</th><td>${updatedQuizMeta.completedOn}</td></tr>
                    <tr><th>Time taken</th><td>${updatedQuizMeta.timeTaken}</td></tr>
                    <tr><th>Marks</th><td>${score}/${total}</td></tr>
                    <tr><th>Grade</th><td>${grade} out of 10 (${percent}%)</td></tr>
                  </table>
                  <div class="grade-display">
                    <h3 style="color:green; margin:0;">You scored ${percent}%!</h3>
                  </div>
                </div>

                <!-- REVIEW CHI TIẾT -->
                <div class="result-details-panel">
                  <h3>Detailed Review</h3>
                  ${questions.map((q, i) => {
                    const isCorrect = answers[q.id] === q.correctIndex;
                    const correctChoice = q.choices[q.correctIndex];
                    const chosen = answers[q.id] !== undefined ? q.choices[answers[q.id]] : "No answer";
                    
                    return `
                      <div class="question-review">
                        <div class="question-header">Question ${i + 1}</div>
                        <div class="question-body">
                          <p><b>${q.text}</b></p>
                          <div class="option ${isCorrect ? 'correct' : 'incorrect'}">
                            <b>Your answer:</b> ${chosen} ${isCorrect ? "✓" : "✗"}
                          </div>
                          ${!isCorrect ? `
                            <div class="option correct">
                              <b>Correct answer:</b> ${correctChoice}
                            </div>
                          ` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- QUIZ NAVIGATION -->
                <div class="result-navigation-panel">
                  <h4>Quiz navigation</h4>
                  <div class="review-nav-grid">
                    ${questions.map((q, i) => {
                      const isCorrect = answers[q.id] === q.correctIndex;
                      return `
                        <div class="nav-cell ${isCorrect ? 'correct' : 'incorrect'}">
                          ${i + 1}
                        </div>
                      `;
                    }).join('')}
                  </div>
                  <button class="finish-review-btn" onclick="location.reload()">Finish review</button>
                </div>
              </div>
            </div>
          `;

          document.querySelector('.exam-wrapper').innerHTML = resultHTML;
          setFinished(true);
        };

        // Nếu đã kết thúc bài, không hiển thị giao diện làm bài
        if (finished) {
          return null;
        }

        // Hiển thị giao diện làm bài
        return (
          <div className="page">
            <div className="exam-wrapper" role="region" aria-label="Exam area">
              <div className="back-wrap" aria-hidden="false">
                <button className="btn-back" id="backBtn">Back</button>
              </div>

             
              <aside className="question-summary" aria-label="Question summary">
                <h4>Question <span id="summary-number">1</span></h4>
                <div className="meta" id="summary-status">Not yet answered</div>
                <div className="meta">Marked out of 1.00</div>
                <div className="flag" id="flagQ">Flag question</div>
              </aside>

           
              <section className="question-card" id="questionCard" aria-live="polite">
                <div>
                  <div className="question-text" id="qText">{questions[current].text}</div>
                </div>

                <div className="choices" id="choicesContainer" role="radiogroup" aria-labelledby="qText"></div>

                <div className="center-footer">
                  <button className="btn-prev" id="prevBtn">Previous page</button>
                  <button className="btn-next" id="nextBtn">Next page</button>
                </div>
              </section>

              
              <aside className="nav-panel" aria-label="Quiz navigation">
                <h3>Quiz navigation</h3>
                <div className="nav-grid" id="navGrid"></div>
                <div className="nav-actions">
                  <a className="finish-link" id="finishLink" href="#" role="button">Finish attempt ...</a>
                </div>
              </aside>

              
              <button className="close-btn" id="closeBtn" title="Close">✕</button>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
